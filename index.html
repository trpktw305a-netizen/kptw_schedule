<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポケツイ イベントカレンダー</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Kaisei+Decol:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho:wght@600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        @import "tailwindcss";
        html {
            overflow-y: scroll;
            -webkit-overflow-scrolling: touch;
            font-family: 'Shippori Mincho', 'Kaisei Decol', serif;
        }
        /* 上のタイトルと統一感が出るよう、見出し・強調箇所に装飾明朝＆上品なウェイトを適用 */
        #currentMonthLabel,
        #selectedDateHeading,
        #selectedDateEvents .text-sm,
        #highlightBannerList .text-xs.truncate {
            font-family: 'Kaisei Decol', 'Shippori Mincho', serif !important;
            font-weight: 700 !important;
            letter-spacing: 0.04em;
        }
        /* 太字クラスのゴツさを和らげて繊細なフォントバランスに統一 */
        .font-extrabold {
            font-weight: 700 !important;
        }
        .font-bold {
            font-weight: 600 !important;
        }
        body {
            background-color: #e4f2ff;
            color: #5c4b5e;
        }
        /* スクロール時にカクつかないGPU固定背景レイヤー */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            transform: translateZ(0);
            will-change: transform;
            background-color: #e4f2ff;
            background-image:
                radial-gradient(circle at 15% 18%, rgba(255, 255, 255, 0.96) 0 44px, transparent 45px),
                radial-gradient(circle at 24% 16%, rgba(255, 255, 255, 0.96) 0 58px, transparent 59px),
                radial-gradient(circle at 33% 19%, rgba(255, 255, 255, 0.96) 0 40px, transparent 41px),
                radial-gradient(circle at 75% 42%, rgba(255, 255, 255, 0.90) 0 48px, transparent 49px),
                radial-gradient(circle at 84% 40%, rgba(255, 255, 255, 0.90) 0 60px, transparent 61px),
                radial-gradient(circle at 92% 43%, rgba(255, 255, 255, 0.90) 0 38px, transparent 39px),
                linear-gradient(180deg, #cde8ff 0%, #fad0e8 52%, #cce9ff 100%);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* メインコンテナ（後ろの雲が透けるよう霧を控えめに） */
        body > div {
            background: rgba(255, 255, 255, 0.20) !important;
            backdrop-filter: blur(2px);
            border-left: 2px solid rgba(255, 255, 255, 0.85);
            border-right: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 30px rgba(186, 230, 253, 0.45);
        }

        /* 枠なしの透かしフェードヘッダー */
        div.sticky.top-0 {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.68) 0%, rgba(255, 255, 255, 0.32) 68%, rgba(255, 255, 255, 0) 100%) !important;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
            mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
            box-shadow: none !important;
            border: none !important;
            filter: none !important;
            padding: 0 !important;
            display: block !important;
        }
        header.bg-gradient-to-r {
            position: relative;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 10px 16px 8px !important;
            box-shadow: none !important;
        }
        header.bg-gradient-to-r::after {
            content: none !important;
        }
        /* 3のゆめかわ・ファンタジーロゴ風（装飾明朝 Kaisei Decol × ラベンダー〜スカイブルー） */
        header h1.cloud-title-badge {
            font-family: 'Kaisei Decol', serif !important;
            font-weight: 700 !important;
            font-size: 1.12rem !important;
            background: transparent !important;
            padding: 0 !important;
            border: none !important;
            box-shadow: none !important;
            letter-spacing: 0.10em !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        header h1.cloud-title-badge .title-main {
            background: linear-gradient(135deg, #6d5cae 0%, #5b78c7 52%, #3b82b6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 6px rgba(255, 255, 255, 0.95));
        }
        header h1.cloud-title-badge .title-sub {
            font-family: 'Cormorant Garamond', serif !important;
            font-style: italic;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            color: #7c6fb0;
        }

/* カード全般（後ろの雲が透ける薄めの半透明パネル） */
        main > div.bg-white {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.34) 0%, rgba(253, 244, 255, 0.28) 100%) !important;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border: 2px solid rgba(255, 255, 255, 0.88) !important;
            border-radius: 28px !important;
            box-shadow:
                0 10px 24px rgba(147, 197, 253, 0.24),
                0 4px 12px rgba(249, 168, 212, 0.20),
                inset 0 -4px 10px rgba(224, 242, 254, 0.55),
                inset 0 3px 8px rgba(255, 255, 255, 0.8) !important;
        }

        /* ハイライトバナー（ニュースティッカー風・右から左へ流れる雲型ピル） */
        @keyframes tickerMarquee {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d(-50%, 0, 0);
            }
        }
        #highlightBannerList .ticker-shell {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            overflow: hidden;
            position: relative;
            padding: 1px 0;
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
        }
        #highlightBannerList .ticker-item span.truncate {
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.95), 0 0 10px rgba(255, 255, 255, 0.9);
        }
        #highlightBannerList .ticker-track {
            display: flex;
            width: max-content;
            will-change: transform;
            animation: tickerMarquee var(--ticker-duration, 18s) linear infinite;
        }
        #highlightBannerList .ticker-shell:hover .ticker-track,
        #highlightBannerList .ticker-shell:active .ticker-track {
            animation-play-state: paused;
        }
        #highlightBannerList .ticker-group {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-right: 14px;
        }
        #highlightBannerList .ticker-item {
            background: transparent !important;
            border: none !important;
            border-radius: 0 !important;
            padding: 2px 10px !important;
            box-shadow: none !important;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        #highlightBannerList .ticker-item:hover {
            background: transparent !important;
            opacity: 0.85;
            transform: scale(1.02);
        }

        /* 月移動ボタン & 見出し */
        #currentMonthLabel {
            color: #5b5494 !important;
            text-shadow: 0 1px 0 #ffffff, 0 0 8px rgba(186, 230, 253, 0.8);
        }
        main > div.bg-white button[onclick^="changeMonth"] {
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 100%) !important;
            color: #0284c7 !important;
            border: 2px solid #ffffff !important;
            border-radius: 9999px !important;
            box-shadow: 0 3px 8px rgba(147, 197, 253, 0.35) !important;
        }


        /* カレンダー枠線（縦・横ともに落ち着いた白〜薄霧トーンに統一） */
        .divide-gray-100 > :not([hidden]) ~ :not([hidden]),
        .border-gray-100,
        #calendarWeeksContainer,
        #calendarWeeksContainer > div {
            border-color: rgba(255, 255, 255, 0.78) !important;
        }
        .bg-pink-50\/90 {
            background: radial-gradient(circle, rgba(252, 231, 243, 0.9) 0%, rgba(224, 242, 254, 0.6) 100%) !important;
            border-radius: 14px;
        }

        /* 選択日の開催カード（ふんわりクラウドカード） */
        #selectedDateEvents > div {
            background: linear-gradient(135deg, #ffffff 0%, #f0f9ff 55%, #fdf2f8 100%) !important;
            border: 2px solid #ffffff !important;
            border-radius: 20px !important;
            box-shadow:
                0 5px 14px rgba(186, 230, 253, 0.35),
                inset 0 -3px 8px rgba(252, 231, 243, 0.55) !important;
        }

        /* モーダル */
        div[id$="Modal"] > div {
            background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 60%, #fdf2f8 100%) !important;
            border: 3px solid #ffffff !important;
            border-radius: 28px !important;
            box-shadow: 0 16px 36px rgba(147, 197, 253, 0.4), 0 6px 18px rgba(244, 114, 182, 0.25) !important;
        }

        #selectedDateEvents > div {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.52) 0%, rgba(240, 249, 255, 0.48) 55%, rgba(253, 242, 248, 0.48) 100%) !important;
            backdrop-filter: blur(2px);
        }

    </style>
</head>

    <script>
        const SUPABASE_URL = "https://neasnxuvjfxeezrniddh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_UulPkVCIss_YPb-tkj5T6g_ZVuAPMI7";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_PASS_STORAGE_KEY = 'poketui_admin_passcode';
        const SPECIAL_CATEGORY_COLORS_KEY = 'poketui_special_category_colors';
        const DEFAULT_SPECIAL_CATEGORY_COLORS = {
            fukubukuro: '#cfa47c',
            choicebag: '#7aa6b8',
            '水やりイベント': '#6b9ac4',
            'パーティービンゴ': '#b5b85c',
            'ドリフェス': '#9c7eb8',
            'ツインズツアー': '#5c6bc0',
            'ミラクルスケッチ': '#6aa89e',
            'ツインズシアター': '#c4839c',
            'ツインズメモリー': '#9b84b8',
            '短期復刻': '#d48c70',
            'その他イベント': '#8d79a6'
        };

        const EVENT_CATEGORY_OPTIONS = [
            { value: 'イベント', label: '✨ イベント', defaultColor: '#8d79a6', placeholder: 'イベント名を選択または入力' },
            { value: 'ツインズシアター', label: '🎬 ツインズシアター', defaultColor: '#c4839c', placeholder: 'ガチャ・タイトル名を入力' },
            { value: 'ツインズメモリー', label: '📷 ツインズメモリー', defaultColor: '#9b84b8', placeholder: '対象ガチャ最大8個（例：ガチャA / ガチャB / ...）' },
            { value: '短期復刻', label: '🔁 短期復刻', defaultColor: '#d48c70', placeholder: '復刻ガチャ名（複数なら / 区切り）' },
            { value: '福袋', label: '🎁 福袋', defaultColor: '#cfa47c', placeholder: '福袋タイトルを入力' },
            { value: 'choicebag', label: '🛍️ choicebag', defaultColor: '#7aa6b8', placeholder: 'choicebagタイトルを入力' }
        ];

        const CUSTOM_EVENT_PRESETS_KEY = 'poketui_custom_event_presets';
        const DEFAULT_EVENT_SUBTYPE_TABS = [
            { value: '水やりイベント', defaultColor: '#6b9ac4' },
            { value: 'パーティービンゴ', defaultColor: '#b5b85c' },
            { value: 'ドリフェス', defaultColor: '#9c7eb8' },
            { value: 'ツインズツアー', defaultColor: '#5c6bc0' },
            { value: 'ミラクルスケッチ', defaultColor: '#6aa89e' }
        ];

        function getCustomEventPresets() {
            try {
                const raw = JSON.parse(localStorage.getItem(CUSTOM_EVENT_PRESETS_KEY) || '[]');
                if (!Array.isArray(raw)) return [];
                return raw.filter(p => p && typeof p.value === 'string' && p.value.trim()).map(p => ({
                    value: p.value.trim(),
                    defaultColor: /^#[0-9a-fA-F]{6}$/.test(p.defaultColor || '') ? p.defaultColor : '#8d79a6'
                }));
            } catch (e) {
                return [];
            }
        }

        function setCustomEventPresets(list) {
            localStorage.setItem(CUSTOM_EVENT_PRESETS_KEY, JSON.stringify(list || []));
        }

        function getEventSubtypeTabs() {
            const base = [...DEFAULT_EVENT_SUBTYPE_TABS];
            const seen = new Set(base.map(b => b.value));
            getCustomEventPresets().forEach(p => {
                if (!seen.has(p.value)) {
                    seen.add(p.value);
                    base.push(p);
                }
            });
            return base;
        }

        function getSpecialCategoryColors() {
            try {
                const saved = JSON.parse(localStorage.getItem(SPECIAL_CATEGORY_COLORS_KEY) || '{}') || {};
                return { ...DEFAULT_SPECIAL_CATEGORY_COLORS, ...saved };
            } catch (e) {
                return { ...DEFAULT_SPECIAL_CATEGORY_COLORS };
            }
        }

        function setSpecialCategoryColors(nextObj) {
            localStorage.setItem(SPECIAL_CATEGORY_COLORS_KEY, JSON.stringify({
                ...DEFAULT_SPECIAL_CATEGORY_COLORS,
                ...(nextObj || {})
            }));
        }

        function resolveFixedEventColor(category, title, fallbackColor = null) {
            const fixed = getSpecialCategoryColors();
            const cat = String(category || '').trim();
            const catLow = cat.toLowerCase();
            const t = String(title || '').trim();

            if (cat === '福袋') return fixed.fukubukuro || '#cfa47c';
            if (catLow === 'choicebag') return fixed.choicebag || '#7aa6b8';
            if (fixed[cat]) return fixed[cat];

            if (cat === 'イベント') {
                if (fixed[t]) return fixed[t];
                const allSubs = getEventSubtypeTabs();
                const matchedSub = allSubs.find(s => t.includes(s.value));
                if (matchedSub) return fixed[matchedSub.value] || matchedSub.defaultColor;
                return fallbackColor || fixed['その他イベント'] || '#8d79a6';
            }
            return fallbackColor || fixed['その他イベント'] || '#8d79a6';
        }
        let isAdminUnlocked = false;

        const todayObj = new Date();
        const todayZero = new Date(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());
        const todayStr = formatDate(todayZero);

        let viewYear = todayZero.getFullYear();
        let viewMonth = todayZero.getMonth();
        let selectedDateStr = todayStr;

        let allSchedules = [];
        let latestNewStartDate = '';

        const WEEKDAYS_JA = ['日', '月', '火', '水', '木', '金', '土'];

        function formatDate(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function parseLocalDate(str) {
            if (!str) return null;
            const [y, m, d] = str.split('-').map(Number);
            if (!y || !m || !d) return null;
            return new Date(y, m - 1, d);
        }

        function diffDaysFromToday(dateStr) {
            const target = parseLocalDate(dateStr);
            if (!target) return null;
            return Math.round((target.getTime() - todayZero.getTime()) / (1000 * 60 * 60 * 24));
        }

        function formatShortMD(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length !== 3) return dateStr;
            return `${Number(parts[1])}/${Number(parts[2])}`;
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ガチャ（release_type === 'gacha' かつ category === 'ガチャ'）のみをガチャ扱いとし、
        // 福袋・Choicebag・ドリフェスなどはイベントと同じ扱いにする
        function isPureGachaItem(ev) {
            if (!ev) return false;
            return ev.source === 'gacha' && ev.release_type === 'gacha' && ev.category === 'ガチャ';
        }

        // 福袋（release_type === 'fukubukuro' または category === '福袋'）かどうか
        function isFukubukuroItem(ev) {
            if (!ev) return false;
            return ev.release_type === 'fukubukuro' || ev.category === '福袋';
        }

        // Choicebag（release_type === 'choicebag' または category === 'Choicebag' / 'choicebag'）かどうか
        function isChoicebagItem(ev) {
            if (!ev) return false;
            const catLow = String(ev.category || '').toLowerCase();
            return ev.release_type === 'choicebag' || catLow === 'choicebag';
        }

        // 短期復刻かどうか（ツインズシアターとは別扱い）
        function isShortReissueItem(ev) {
            const cat = String(ev && ev.category || '').trim();
            return cat === '短期復刻';
        }

        // ツインズシアター（短期復刻の福袋）かどうか
        function isTwinsTheaterItem(ev) {
            const cat = String(ev && ev.category || '').trim();
            return cat === 'ツインズシアター';
        }

        // 短期復刻の日付ベース状態判定：開催中（復刻中）か、終了日を過ぎたか（復刻済）
        function getShortReissueStatus(ev) {
            if (!isShortReissueItem(ev)) return null;
            const start = ev.start_date || '';
            const end = ev.end_date || start;
            if (start && end && start <= todayStr && end >= todayStr) {
                return 'reissuing'; // 復刻中
            }
            if (end && end < todayStr) {
                return 'reissued'; // 復刻済（終了日経過後に自動判定）
            }
            return 'upcoming'; // 開催前
        }

        // カレンダー上で開始日・終了日マーカーとして表示する対象（ガチャのみ。福袋・短期復刻は期間中バー表示）
        function isMarkerScheduleItem(ev) {
            return isPureGachaItem(ev);
        }

        function computeLatestNewStartDate(list) {
            const candidates = list.filter(item => isMarkerScheduleItem(item) && item.start_date && item.start_date >= todayStr);
            return candidates.reduce((latest, item) => (!latest || item.start_date > latest.start_date || item.start_date === latest.start_date) ? item : latest, null);
        }

        function hydrateScheduleFlags(list) {
            latestNewStartDate = computeLatestNewStartDate(list);
            return list.map(ev => {
                const start = ev.start_date;
                const end = ev.end_date || ev.start_date;
                const gachaOnly = isPureGachaItem(ev);
                const fukuOnly = isFukubukuroItem(ev);
                const choiceOnly = isChoicebagItem(ev);
                const markerItem = isMarkerScheduleItem(ev);
                // 今日が最終日かどうか（上部バナー用）
                const isLastDayToday = Boolean(end && end === todayStr && start <= todayStr);
                const hasEndDay = Boolean(end && markerItem);
                const isStartDay = Boolean(start && markerItem);
                const isNew = Boolean(start && ev === latestNewStartDate && markerItem);
                const isActive = Boolean(start && end && start <= todayStr && end >= todayStr);
                const reissueStatus = getShortReissueStatus({ ...ev, end_date: end });
                return {
                    ...ev,
                    end_date: end,
                    _isPureGacha: gachaOnly,
                    _isFukubukuro: fukuOnly,
                    _isChoicebag: choiceOnly,
                    _isShortReissue: isShortReissueItem(ev),
                    _isTwinsTheater: isTwinsTheaterItem(ev),
                    _reissueStatus: reissueStatus,
                    _isMarkerItem: markerItem,
                    _isLastDay: isLastDayToday,
                    _hasEndDay: hasEndDay,
                    _isStartDay: isStartDay,
                    _isNew: isNew,
                    _isActive: isActive
                };
            });
        }

        function splitMultiTitles(rawTitle) {
            return String(rawTitle || '')
                .split(/(?:\r?\n|\s+\/\s+|／|・|、|,)+/)
                .map(s => s.trim())
                .filter(Boolean);
        }

        function formatCalendarBarLabel(ev) {
            const cat = (ev.category || '').trim();
            const title = (ev.title || '').trim();
            if (ev._isFukubukuro) {
                return title && title !== '福袋' ? `福袋｜${title}` : '福袋';
            }
            if (ev._isChoicebag) {
                return title && title.toLowerCase() !== 'choicebag' ? `choicebag｜${title}` : 'choicebag';
            }
            if (cat === 'ツインズメモリー') {
                return 'ツインズメモリー';
            }
            if (cat === '短期復刻') {
                const items = splitMultiTitles(title);
                const prefix = '短期復刻';
                if (!items.length || title === '短期復刻') return '短期復刻';
                return items.length > 1 ? `${prefix}｜${items[0]} ほか` : `${prefix}｜${items[0]}`;
            }
            if (cat === 'ツインズシアター') {
                const items = splitMultiTitles(title);
                const prefix = 'ツインズシアター';
                if (!items.length || title === 'ツインズシアター') return 'ツインズシアター';
                return items.length > 1 ? `${prefix}｜${items[0]} ほか` : `${prefix}｜${items[0]}`;
            }
            return title || cat;
        }

        function getCategoryStyle(category, isPureGacha = false) {
            if (category === 'ガチャ' && isPureGacha) {
                return {
                    barBg: 'bg-[#b57c8c] text-white',
                    pillBg: 'bg-pink-100 text-pink-700 border-pink-200',
                    icon: '🎪'
                };
            }
            if (category === '福袋') {
                return {
                    barBg: 'bg-[#cfa47c] text-white',
                    pillBg: 'bg-amber-100 text-amber-800 border-amber-300',
                    icon: '🎁'
                };
            }
            return {
                barBg: 'bg-[#8d79a6] text-white',
                pillBg: 'bg-purple-100 text-purple-700 border-purple-200',
                icon: '✨'
            };
        }

        function initApp() {
            syncMonthPickerUI();
            bindCalendarSwipe();
            renderCalendar();
            renderSelectedDateEvents();
            loadAllSchedules();
            trackDailyPageView();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }

        async function reloadAllData() {
            await loadAllSchedules();
            updateSyncStatusBox();
        }

        async function loadAllSchedules() {
            const combined = [];
            try {
                // 1. public.events から取得
                let { data: eventRows, error: eventErr } = await supabaseClient
                    .from('events')
                    .select('id, title, category, start_date, end_date, created_at, color')
                    .order('start_date', { ascending: true });
                if (eventErr && String(eventErr.message || '').toLowerCase().includes('color')) {
                    const fallback = await supabaseClient.from('events').select('id, title, category, start_date, end_date, created_at').order('start_date', { ascending: true });
                    eventRows = fallback.data; eventErr = fallback.error;
                }

                if (!eventErr && eventRows) {
                    eventRows.forEach(ev => {
                        const cat = (ev.category || 'イベント').trim();
                        combined.push({
                            id: ev.id,
                            source: 'event',
                            title: ev.title,
                            category: cat,
                            release_type: cat === 'ガチャ' ? 'gacha' : 'event',
                            start_date: ev.start_date,
                            end_date: ev.end_date || ev.start_date,
                            color: resolveFixedEventColor(cat, ev.title, ev.color || null)
                        });
                    });
                }

                // 2. public.items からガチャ・福袋・Choicebag・ドリフェス等を取得
                const pageSize = 1000;
                let from = 0;
                let allItemRows = [];
                while (true) {
                    const { data: chunk, error: itemErr } = await supabaseClient
                        .from('items')
                        .select('gacha_group_name, gacha_start_date, gacha_end_date, release_type')
                        .not('gacha_group_name', 'is', null)
                        .range(from, from + pageSize - 1);

                    if (itemErr || !chunk) break;
                    allItemRows = allItemRows.concat(chunk);
                    if (chunk.length < pageSize) break;
                    from += chunk.length;
                }

                const gachaMap = new Map();
                allItemRows.forEach(row => {
                    const name = (row.gacha_group_name || '').trim();
                    if (!name) return;
                    const start = row.gacha_start_date || '';
                    const end = row.gacha_end_date || '';
                    if (!start && !end) return;

                    if (!gachaMap.has(name)) {
                        gachaMap.set(name, {
                            start: start || end,
                            end: end || start,
                            releaseType: row.release_type || 'gacha'
                        });
                    } else {
                        const prev = gachaMap.get(name);
                        if (start && (!prev.start || start < prev.start)) prev.start = start;
                        if (end && (!prev.end || end > prev.end)) prev.end = end;
                    }
                });

                const specialCatColors = getSpecialCategoryColors();
                gachaMap.forEach((info, name) => {
                    const relType = info.releaseType || 'gacha';
                    const catLabel = ({ gacha: 'ガチャ', fukubukuro: '福袋', dreamfes: 'ドリフェス', choicebag: 'Choicebag' }[relType] || 'イベント');
                    combined.push({
                        id: `gacha_${name}`,
                        source: 'gacha',
                        title: name,
                        category: catLabel,
                        release_type: relType,
                        start_date: info.start,
                        end_date: info.end,
                        color: specialCatColors[relType] || null
                    });
                });
            } catch (err) {
                console.warn('読み込みエラー:', err);
            }

            allSchedules = hydrateScheduleFlags(combined);
            renderHighlightBanners();
            renderCalendar();
            renderSelectedDateEvents();
        }

        function getFilteredSchedules() {
            return [...allSchedules];
        }

        // 上部の注目バー（ニュースティッカー風に右から左へ流れる表示）
        function renderHighlightBanners() {
            const container = document.getElementById('highlightBannerList');
            if (!container) return;

            const scoped = getFilteredSchedules();
            const activeItems = scoped.filter(ev => ev._isLastDay || ev._isNew).sort((a, b) => {
                if (a._isLastDay !== b._isLastDay) return a._isLastDay ? -1 : 1;
                if (a._isNew !== b._isNew) return a._isNew ? -1 : 1;
                return (a.end_date || '').localeCompare(b.end_date || '');
            });

            if (activeItems.length === 0) {
                container.innerHTML = '';
                return;
            }

            const itemsHtml = activeItems.map(ev => {
                const st = getCategoryStyle(ev.category, ev._isPureGacha);
                const remDays = diffDaysFromToday(ev.end_date);
                let leftBadge = '';
                if (ev._isLastDay || remDays === 0) {
                    leftBadge = `<span class="shrink-0 text-[10px] bg-rose-400/90 text-white px-2 py-0.5 rounded-full font-extrabold shadow-2xs">⏰ 最終日</span>`;
                } else if (ev._isNew) {
                    leftBadge = `<span class="shrink-0 text-[10px] bg-gradient-to-r from-pink-500 to-amber-500 text-white px-2 py-0.5 rounded-full font-extrabold">✨ NEW</span>`;
                } else if (remDays !== null && remDays > 0) {
                    leftBadge = `<span class="shrink-0 text-[10px] bg-rose-500 text-white px-2 py-0.5 rounded-full font-extrabold">残り${remDays}日</span>`;
                }

                const extraNewBadge = (ev._isLastDay && ev._isNew)
                    ? `<span class="shrink-0 text-[9px] bg-pink-500 text-white px-1.5 py-0.5 rounded-full font-extrabold">NEW</span>`
                    : '';

                return `
                    <button type="button" onclick="jumpToSchedule('${ev.start_date}', '${ev.end_date}')" class="ticker-item text-left">
                        ${leftBadge}
                        ${extraNewBadge}
                        <span class="shrink-0 text-[10px] px-2 py-0.5 rounded-full border font-bold ${st.pillBg}">${escapeHtml(ev.category)}</span>
                        <span class="text-xs font-extrabold text-gray-900 truncate">${escapeHtml(ev.title)}</span>
                        <span class="shrink-0 text-[10px] font-bold text-gray-500">〜${formatShortMD(ev.end_date)}</span>
                    </button>
                `;
            }).join('');

            // 件数に応じて自然な速度（1件あたり約10秒、最低14秒）を計算
            const durationSec = Math.max(14, activeItems.length * 10);

            container.innerHTML = `
                <div class="ticker-shell" style="--ticker-duration: ${durationSec}s;">
                    <div class="ticker-track">
                        <div class="ticker-group">${itemsHtml}</div>
                        <div class="ticker-group" aria-hidden="true">${itemsHtml}</div>
                    </div>
                </div>
            `;
        }

        function jumpToSchedule(startDate, endDate) {
            const target = (endDate === todayStr) ? endDate : (startDate || todayStr);
            const d = parseLocalDate(target);
            if (d) {
                viewYear = d.getFullYear();
                viewMonth = d.getMonth();
                selectedDateStr = target;
                renderCalendar();
                renderSelectedDateEvents();
            }
        }

        // 週ごとの横帯（ガントバー）付きカレンダー描画
        // ガチャ（_isPureGacha）は開始日（🚩 / 🚩 NEW）と全ガチャの終了日（⏰）を表示し、
        // それ以外（イベント・福袋・Choicebag・ドリフェス・短期復刻）は期間中すべて横帯バーで表示する
        function renderCalendar() {
            const labelEl = document.getElementById('currentMonthLabel');
            if (labelEl) labelEl.textContent = `${viewYear}年${viewMonth + 1}月`;

            const container = document.getElementById('calendarWeeksContainer');
            if (!container) return;

            const firstOfMonth = new Date(viewYear, viewMonth, 1);
            const startDow = firstOfMonth.getDay();
            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

            const cells = [];
            for (let i = startDow - 1; i >= 0; i--) {
                const d = new Date(viewYear, viewMonth, -i);
                cells.push({ dateObj: d, dateStr: formatDate(d), inMonth: false });
            }
            for (let day = 1; day <= daysInMonth; day++) {
                const d = new Date(viewYear, viewMonth, day);
                cells.push({ dateObj: d, dateStr: formatDate(d), inMonth: true });
            }
            while (cells.length % 7 !== 0) {
                const nextIdx = cells.length - (startDow + daysInMonth) + 1;
                const d = new Date(viewYear, viewMonth + 1, nextIdx);
                cells.push({ dateObj: d, dateStr: formatDate(d), inMonth: false });
            }

            const scopedEvents = getFilteredSchedules();
            const weeks = [];
            for (let i = 0; i < cells.length; i += 7) {
                weeks.push(cells.slice(i, i + 7));
            }

            container.innerHTML = weeks.map(week => {
                const weekStartStr = week[0].dateStr;
                const weekEndStr = week[6].dateStr;

                const renderItems = [];
                scopedEvents.forEach(ev => {
                    if (!ev.start_date) return;
                    const end = ev.end_date || ev.start_date;
                    if (ev.start_date > weekEndStr || end < weekStartStr) return;

                    if (ev._isMarkerItem) {
                        if (ev.start_date >= weekStartStr && ev.start_date <= weekEndStr) {
                            renderItems.push({
                                ev,
                                markerType: 'start',
                                targetDate: ev.start_date,
                                sortDate: ev.start_date
                            });
                        }
                        if (end && end >= weekStartStr && end <= weekEndStr) {
                            renderItems.push({
                                ev,
                                markerType: 'end',
                                targetDate: end,
                                sortDate: end
                            });
                        }
                    } else {
                        renderItems.push({
                            ev,
                            markerType: 'bar',
                            targetDate: null,
                            sortDate: ev.start_date
                        });
                    }
                });

                renderItems.sort((a, b) => {
                    if (a.sortDate !== b.sortDate) return a.sortDate.localeCompare(b.sortDate);
                    if (a.markerType !== b.markerType) {
                        const order = { end: 0, start: 1, bar: 2 };
                        return (order[a.markerType] ?? 9) - (order[b.markerType] ?? 9);
                    }
                    return (b.ev.end_date || '').localeCompare(a.ev.end_date || '');
                });

                const lanes = [];
                renderItems.forEach(item => {
                    const { ev, markerType, targetDate } = item;
                    const isGachaMarker = markerType === 'start' || markerType === 'end';
                    const markerIdx = isGachaMarker ? week.findIndex(c => c.dateStr === targetDate) : -1;
                    if (isGachaMarker && markerIdx === -1) return;

                    const sIdx = isGachaMarker ? markerIdx : Math.max(0, week.findIndex(c => c.dateStr >= ev.start_date));
                    let eIdx = 6;
                    if (isGachaMarker) {
                        eIdx = sIdx;
                    } else {
                        for (let idx = 6; idx >= 0; idx--) {
                            if (week[idx].dateStr <= (ev.end_date || ev.start_date)) {
                                eIdx = idx;
                                break;
                            }
                        }
                    }
                    if (sIdx === -1 || eIdx < sIdx) return;

                    let laneIdx = lanes.findIndex(lane => lane.every(seg => eIdx < seg.sIdx || sIdx > seg.eIdx));
                    if (laneIdx === -1) {
                        laneIdx = lanes.length;
                        lanes.push([]);
                    }
                    lanes[laneIdx].push({ ev, markerType, targetDate, sIdx, eIdx });
                });

                const dayHeadersHtml = week.map((cell, colIdx) => {
                    const isToday = cell.dateStr === todayStr;
                    const isSelected = cell.dateStr === selectedDateStr;
                    const numCls = !cell.inMonth
                        ? 'text-gray-300'
                        : colIdx === 0
                            ? 'text-rose-500'
                            : colIdx === 6
                                ? 'text-sky-600'
                                : 'text-gray-800';
                    const bgCls = isSelected ? 'bg-pink-50/90' : '';

                    return `
                        <button type="button" onclick="selectDate('${cell.dateStr}')" class="py-1.5 flex flex-col items-center justify-center relative transition-colors ${bgCls}">
                            <span class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-extrabold ${isToday ? 'bg-[#d98a9e] text-white shadow-2xs ring-2 ring-white/85' : isSelected ? 'ring-1 ring-[#d98a9e]/80 ' + numCls : numCls}">
                                ${cell.dateObj.getDate()}
                            </span>
                        </button>
                    `;
                }).join('');

                const lanesHtml = lanes.map(lane => {
                    let rowCols = '';
                    let cursor = 0;
                    lane.sort((a, b) => a.sIdx - b.sIdx).forEach(seg => {
                        if (seg.sIdx > cursor) {
                            rowCols += `<div style="grid-column: span ${seg.sIdx - cursor};"></div>`;
                        }
                        const span = seg.eIdx - seg.sIdx + 1;
                        const st = getCategoryStyle(seg.ev.category, seg.ev._isPureGacha);
                        const isGachaMarker = seg.markerType === 'start' || seg.markerType === 'end';
                        const isStartInWeek = (isGachaMarker ? seg.targetDate : seg.ev.start_date) >= weekStartStr;
                        const isEndInWeek = (isGachaMarker ? seg.targetDate : (seg.ev.end_date || seg.ev.start_date)) <= weekEndStr;
                        const roundCls = isGachaMarker
                            ? 'rounded-full px-0.5'
                            : `${isStartInWeek ? 'rounded-l-full pl-2' : 'pl-1'} ${isEndInWeek ? 'rounded-r-full pr-2' : 'pr-1'}`;

                        const barTitleText = formatCalendarBarLabel(seg.ev);

                        const markerLabel = seg.markerType === 'end'
                            ? '⏰'
                            : seg.markerType === 'start'
                                ? (seg.ev._isNew ? '🚩 NEW' : '🚩')
                                : escapeHtml(barTitleText);

                        const markerStyle = seg.markerType === 'end'
                            ? 'bg-[#b87b88]/85 text-white border border-[#a36875]/80'
                            : seg.markerType === 'start'
                                ? (seg.ev._isNew ? 'bg-[#fae7b5]/95 text-[#7a5228] border border-[#e3c47d]/90' : 'bg-[#fdf3d7]/95 text-[#7c5e3c] border border-[#ebd7a8]/90')
                                : st.barBg;

                        const isPastReissue = seg.ev._isShortReissue && seg.ev._reissueStatus === 'reissued';
                        const customColorStyle = (!isGachaMarker && seg.ev.color)
                            ? `background-color:${seg.ev.color};color:#fff;${isPastReissue ? 'opacity:0.78;' : ''}`
                            : '';

                        const sizeCls = isGachaMarker ? 'text-[8px] tracking-tighter' : 'text-[10px]';

                        rowCols += `
                            <button type="button" onclick="selectDate('${week[seg.sIdx].dateStr}')" style="grid-column: span ${span};${customColorStyle}" class="${markerStyle} ${roundCls} h-4.5 ${sizeCls} font-bold leading-none flex items-center ${isGachaMarker ? 'justify-center text-center' : 'text-left'} truncate shadow-2xs hover:opacity-90">
                                <span class="truncate">${markerLabel}</span>
                            </button>
                        `;
                        cursor = seg.eIdx + 1;
                    });
                    if (cursor < 7) {
                        rowCols += `<div style="grid-column: span ${7 - cursor};"></div>`;
                    }
                    return `<div class="grid grid-cols-7 gap-x-0.5 px-0.5">${rowCols}</div>`;
                }).join('');

                return `
                    <div class="pb-1.5 relative">
                        <div aria-hidden="true" class="pointer-events-none absolute inset-0 grid grid-cols-7 divide-x divide-white/75">
                            <div></div><div></div><div></div><div></div><div></div><div></div><div></div>
                        </div>
                        <div class="relative z-10 grid grid-cols-7">${dayHeadersHtml}</div>
                        ${lanesHtml ? `<div class="relative z-10 space-y-1 mt-0.5">${lanesHtml}</div>` : '<div class="relative z-10 h-2"></div>'}
                    </div>
                `;
            }).join('');
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();
            renderSelectedDateEvents();
        }

        function changeMonth(delta) {
            const totalMonths = viewYear * 12 + viewMonth + delta;
            viewYear = Math.floor(totalMonths / 12);
            viewMonth = ((totalMonths % 12) + 12) % 12;
            syncMonthPickerUI();
            renderCalendar();
        }

        function toggleMonthPicker() {
            const picker = document.getElementById('monthQuickPicker');
            if (!picker) return;
            const willOpen = picker.classList.contains('hidden');
            if (willOpen) {
                syncMonthPickerUI();
                picker.classList.remove('hidden');
            } else {
                picker.classList.add('hidden');
            }
        }

        function syncMonthPickerUI() {
            const yearSel = document.getElementById('pickerYearSelect');
            const monthGrid = document.getElementById('pickerMonthGrid');
            if (!yearSel || !monthGrid) return;

            const baseYear = todayZero.getFullYear();
            const minYear = Math.min(baseYear - 4, viewYear - 1);
            const maxYear = Math.max(baseYear + 2, viewYear + 1);

            let yearOptions = '';
            for (let y = maxYear; y >= minYear; y--) {
                yearOptions += `<option value="${y}" ${y === viewYear ? 'selected' : ''}>${y}年</option>`;
            }
            yearSel.innerHTML = yearOptions;

            monthGrid.innerHTML = Array.from({ length: 12 }, (_, m) => {
                const active = m === viewMonth;
                const cls = active
                    ? 'bg-pink-500 text-white font-bold shadow-2xs'
                    : 'bg-white/80 text-[#5b5494] hover:bg-sky-50 border border-sky-100 font-semibold';
                return `<button type="button" onclick="selectPickerMonth(${m})" class="py-1 rounded-lg text-[10px] transition-colors ${cls}">${m + 1}月</button>`;
            }).join('');
        }

        function applyPickerYearMonth() {
            const yearSel = document.getElementById('pickerYearSelect');
            if (!yearSel) return;
            viewYear = Number(yearSel.value) || viewYear;
            syncMonthPickerUI();
            renderCalendar();
        }

        function selectPickerMonth(m) {
            viewMonth = m;
            syncMonthPickerUI();
            renderCalendar();
            const picker = document.getElementById('monthQuickPicker');
            if (picker) picker.classList.add('hidden');
        }

        function bindCalendarSwipe() {
            const calEl = document.getElementById('calendarWeeksContainer');
            if (!calEl || calEl.dataset.swipeBound) return;
            calEl.dataset.swipeBound = '1';

            let startX = 0;
            let startY = 0;
            let tracking = false;

            calEl.addEventListener('touchstart', (e) => {
                if (!e.touches || e.touches.length !== 1) return;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                tracking = true;
            }, { passive: true });

            calEl.addEventListener('touchend', (e) => {
                if (!tracking || !e.changedTouches || e.changedTouches.length !== 1) return;
                tracking = false;
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const dx = endX - startX;
                const dy = endY - startY;
                if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
                    if (dx > 0) {
                        changeMonth(-1); // 右スワイプで前月へ遡る
                    } else {
                        changeMonth(1);  // 左スワイプで翌月へ進む
                    }
                }
            }, { passive: true });
        }

        function goToday() {
            viewYear = todayZero.getFullYear();
            viewMonth = todayZero.getMonth();
            selectedDateStr = todayStr;
            syncMonthPickerUI();
            renderCalendar();
            renderSelectedDateEvents();
        }

        function renderSelectedDateEvents() {
            const headingEl = document.getElementById('selectedDateHeading');
            const container = document.getElementById('selectedDateEvents');
            if (!headingEl || !container) return;

            const d = parseLocalDate(selectedDateStr) || todayZero;
            const label = `${d.getMonth() + 1}月${d.getDate()}日(${WEEKDAYS_JA[d.getDay()]})の開催一覧`;
            headingEl.innerHTML = `<span>📌</span><span>${label}</span>`;

            const scoped = getFilteredSchedules();
            const list = scoped.filter(ev => {
                if (!ev.start_date) return false;
                const end = ev.end_date || ev.start_date;
                if (ev._isMarkerItem && selectedDateStr !== ev.start_date && selectedDateStr !== end) return false;
                return selectedDateStr >= ev.start_date && selectedDateStr <= end;
            }).sort((a, b) => {
                const aLast = (a.end_date || a.start_date) === selectedDateStr;
                const bLast = (b.end_date || b.start_date) === selectedDateStr;
                if (aLast !== bLast) return aLast ? -1 : 1;
                if (a._isNew !== b._isNew) return a._isNew ? -1 : 1;
                return (a.end_date || '').localeCompare(b.end_date || '');
            });

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-5 text-xs text-gray-400 bg-gray-50/70 rounded-xl border border-dashed border-gray-200">この日の開催予定はありません</div>`;
                return;
            }

            container.innerHTML = list.map(ev => {
                const isTwinsTheater = Boolean(ev._isTwinsTheater);
                const isShortReissue = Boolean(ev._isShortReissue);
                const st = isTwinsTheater
                    ? { barBg: 'bg-[#c4839c] text-white', pillBg: 'bg-pink-100 text-pink-800 border-pink-200', icon: '🎬' }
                    : isShortReissue
                        ? { barBg: 'bg-[#d48c70] text-white', pillBg: 'bg-orange-100 text-orange-800 border-orange-200', icon: '🔁' }
                        : getCategoryStyle(ev.category, ev._isPureGacha);
                const displayCategoryLabel = ev.category;
                const period = ev.start_date === ev.end_date ? ev.start_date : `${ev.start_date} 〜 ${ev.end_date}`;
                const isLastOnSelected = ev.end_date === selectedDateStr;
                const isStartOnSelected = ev.start_date === selectedDateStr;

                let statusBadges = '';
                if (isShortReissue && ev._reissueStatus === 'reissuing') {
                    statusBadges += `<span class="text-[10px] bg-amber-100 text-amber-800 border border-amber-300 px-2 py-0.5 rounded-full font-extrabold">🔁 復刻中</span>`;
                }
                if (isTwinsTheater) {
                    statusBadges += `<span class="text-[10px] bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-full font-bold">🎁 短期復刻福袋</span>`;
                }
                if (isLastOnSelected) {
                    statusBadges += `<span class="text-[10px] bg-rose-400/90 text-white px-2 py-0.5 rounded-full font-extrabold shadow-2xs">⏰ 最終日</span>`;
                }
                if (isStartOnSelected && ev._isMarkerItem) {
                    statusBadges += `<span class="text-[10px] bg-[#fdf3d7] text-[#7c5e3c] border border-[#ebd7a8] px-2 py-0.5 rounded-full font-extrabold">🚩 初日</span>`;
                }
                if (isStartOnSelected && ev._isNew) {
                    statusBadges += `<span class="text-[10px] bg-gradient-to-r from-pink-500 to-amber-500 text-white px-2 py-0.5 rounded-full font-extrabold">NEW</span>`;
                }

                const editBtn = '';

                const multiList = (ev.category === 'ツインズメモリー' || isTwinsTheater || isShortReissue)
                    ? splitMultiTitles(ev.title)
                    : [];
                const reissueSubTag = (ev._isShortReissue && ev._reissueStatus === 'reissuing')
                    ? `<span class="text-[9px] px-1.5 py-0.2 rounded bg-amber-100 text-amber-800 font-bold shrink-0">復刻中</span>`
                    : '';
                const isTwinsMemoryMulti = ev.category === 'ツインズメモリー' && multiList.length >= 4;
                const titleBlockHtml = multiList.length > 1
                    ? `<div class="${isTwinsMemoryMulti ? 'grid grid-cols-1 sm:grid-cols-2 gap-x-2 gap-y-1' : 'space-y-1'} pt-0.5">
                        ${multiList.map(t => `<div class="text-xs font-bold text-gray-900 flex items-center gap-1 min-w-0"><span class="text-pink-400 shrink-0">・</span><span class="truncate">${escapeHtml(t)}</span>${reissueSubTag}</div>`).join('')}
                       </div>`
                    : `<div class="text-sm font-extrabold text-gray-900 break-words">${escapeHtml(ev.title || ev.category)}</div>`;

                return `
                    <div style="${!ev._isPureGacha && ev.color ? `border-left:5px solid ${ev.color};` : ''}" class="bg-gray-50/80 border border-gray-200/80 rounded-xl p-3 flex items-center justify-between gap-2">
                        <div class="space-y-1 min-w-0 flex-1">
                            <div class="flex items-center gap-1.5 flex-wrap">
                                <span class="text-[10px] px-2 py-0.5 rounded-md border font-bold ${st.pillBg}">${escapeHtml(displayCategoryLabel)}</span>
                                ${statusBadges}
                                <span class="text-[11px] text-gray-500 font-medium">${period}</span>
                            </div>
                            ${titleBlockHtml}
                        </div>
                        ${editBtn}
                    </div>
                `;
            }).join('');
        }

        // 開催履歴（ガチャ・短期復刻以外）
        function isHistoryTargetSchedule(ev) {
            if (!ev || !ev.start_date) return false;
            if (ev._isPureGacha) return false;
            const cat = (ev.category || '').trim();
            if (cat === 'ガチャ' || cat === '短期復刻') return false;
            return true;
        }

        function normalizeTheaterTitleKey(rawTitle) {
            return String(rawTitle || '')
                .trim()
                .replace(/[\s\u3000]+/g, ' ')
                .toLowerCase();
        }

        function getHistoryGroupKey(ev) {
            const cat = (ev.category || 'イベント').trim();
            const catLow = cat.toLowerCase();
            if (cat === 'イベント') {
                return `イベント::${(ev.title || '').trim()}`;
            }
            if (cat === 'ツインズシアター') {
                return 'ツインズシアター';
            }
            if (catLow === 'choicebag' || ev._isChoicebag) {
                return 'choicebag';
            }
            if (cat === '福袋' || ev._isFukubukuro) {
                return '福袋';
            }
            return cat;
        }

        function getHistoryGroupDisplay(groupKey, sampleItem = null) {
            if (groupKey.startsWith('イベント::')) {
                const name = groupKey.slice('イベント::'.length);
                return { category: 'イベント', label: name || 'イベント' };
            }
            if (groupKey === 'ツインズシアター') {
                return { category: 'ツインズシアター', label: 'ツインズシアター' };
            }
            return { category: groupKey, label: groupKey };
        }

        let activeHistoryFilterKey = '';

        function openHistoryModal(filterKey = '') {
            activeHistoryFilterKey = filterKey || '';
            const searchInp = document.getElementById('historySearchInput');
            if (searchInp) searchInp.value = '';
            renderHistoryModalList();
            document.getElementById('historyModal').classList.remove('hidden');
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
        }

        function clearHistoryFilter() {
            activeHistoryFilterKey = '';
            const searchInp = document.getElementById('historySearchInput');
            if (searchInp) searchInp.value = '';
            renderHistoryModalList();
        }

        function renderHistoryModalList() {
            const body = document.getElementById('historyModalBody');
            const clearBtn = document.getElementById('historyClearFilterBtn');
            const q = (document.getElementById('historySearchInput')?.value || '').trim().toLowerCase();
            if (!body) return;

            if (clearBtn) {
                clearBtn.classList.toggle('hidden', !activeHistoryFilterKey && !q);
            }

            const targets = allSchedules.filter(isHistoryTargetSchedule);
            const groupsMap = new Map();

            targets.forEach(ev => {
                const key = getHistoryGroupKey(ev);
                if (!groupsMap.has(key)) {
                    groupsMap.set(key, []);
                }
                groupsMap.get(key).push(ev);
            });

            let groups = Array.from(groupsMap.entries()).map(([key, items]) => {
                items.sort((a, b) => b.start_date.localeCompare(a.start_date));
                const latest = items[0];
                const disp = getHistoryGroupDisplay(key, latest);
                return { key, ...disp, items, latest };
            });

            // 経過日数順（前回開催終了からの経過日数が長い順＝長く来ていない順、開催中・開催前は末尾側へ）
            groups.sort((a, b) => {
                const aEnd = a.latest.end_date || a.latest.start_date;
                const bEnd = b.latest.end_date || b.latest.start_date;
                const aDiff = diffDaysFromToday(aEnd) ?? 0;
                const bDiff = diffDaysFromToday(bEnd) ?? 0;
                if (aDiff !== bDiff) return aDiff - bDiff;
                return a.latest.start_date.localeCompare(b.latest.start_date);
            });

            if (activeHistoryFilterKey) {
                groups = groups.filter(g => g.key === activeHistoryFilterKey);
            }
            if (q) {
                groups = groups.filter(g =>
                    g.label.toLowerCase().includes(q) ||
                    g.category.toLowerCase().includes(q) ||
                    g.items.some(it => (it.title || '').toLowerCase().includes(q))
                );
            }

            if (!groups.length) {
                body.innerHTML = `<div class="text-center py-8 text-gray-400 bg-gray-50/70 rounded-2xl border border-dashed border-gray-200">該当する開催履歴がありません</div>`;
                return;
            }

            body.innerHTML = groups.map(g => {
                const st = getCategoryStyle(g.category, false);
                const latestColor = g.latest.color || getDefaultColorForEvent(g.category, g.latest.title);
                const latestEnd = g.latest.end_date || g.latest.start_date;
                const sinceEnd = diffDaysFromToday(latestEnd);
                const sinceStart = diffDaysFromToday(g.latest.start_date);
                const isRunningNow = (sinceStart !== null && sinceStart <= 0) && (sinceEnd !== null && sinceEnd >= 0);
                const elapsedText = isRunningNow
                    ? (sinceEnd === 0 ? '本日最終日' : '開催中')
                    : (sinceEnd !== null && sinceEnd < 0)
                        ? `終了から${Math.abs(sinceEnd)}日経過`
                        : '開催前';
                const statusBadge = `<div class="flex items-center gap-1 flex-wrap">
                    <span class="text-[10px] px-2 py-0.5 rounded-full bg-rose-50 text-rose-800 border border-rose-200 font-bold">${escapeHtml(elapsedText)}</span>
                </div>`;

                const rowsHtml = g.items.map((it, idx) => {
                    const period = it.start_date === it.end_date
                        ? it.start_date.replace(/-/g, '/')
                        : `${it.start_date.replace(/-/g, '/')} 〜 ${formatShortMD(it.end_date)}`;
                    const tag = idx === 0
                        ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-pink-500 text-white font-bold">最新</span>`
                        : idx === 1
                            ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-purple-100 text-purple-800 font-bold">前回</span>`
                            : `<span class="text-[9px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500 font-medium">${g.items.length - idx}回目</span>`;
                    const subTitle = (g.category !== 'イベント' && it.title && it.title !== g.category)
                        ? `<div class="text-[10px] text-gray-600 truncate pl-1">${escapeHtml(it.title)}</div>`
                        : '';
                    return `
                        <button type="button" onclick="closeHistoryModal(); jumpToSchedule('${it.start_date}', '${it.end_date}')" class="w-full text-left py-1.5 px-2 rounded-lg hover:bg-purple-50/80 transition-colors flex flex-col gap-0.5">
                            <div class="flex items-center justify-between gap-1.5">
                                <div class="flex items-center gap-1.5">
                                    ${tag}
                                    <span class="text-[11px] font-bold text-gray-800">${period}</span>
                                </div>
                                <span class="text-[10px] text-purple-500 font-bold">移動 →</span>
                            </div>
                            ${subTitle}
                        </button>
                    `;
                }).join('');

                return `
                    <div style="border-left: 5px solid ${escapeHtml(latestColor)};" class="bg-white/90 border border-purple-100 rounded-2xl p-3 space-y-2 shadow-2xs">
                        <div class="flex items-center justify-between gap-2 flex-wrap">
                            <div class="flex items-center gap-1.5">
                                <span class="text-[10px] px-2 py-0.5 rounded-md border font-bold ${st.pillBg}">${escapeHtml(g.category)}</span>
                                <span class="text-xs font-extrabold text-gray-900">${escapeHtml(g.label)}</span>
                            </div>
                            ${statusBadge}
                        </div>
                        <div class="divide-y divide-gray-100 border-t border-gray-100 pt-1">
                            ${rowsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 日別アクセス計測（Supabase: page_views テーブル）
        const ACCESS_LOG_STORAGE_KEY = 'poketui_cal_last_pv_date';

        async function trackDailyPageView() {
            try {
                if (localStorage.getItem(ACCESS_LOG_STORAGE_KEY) === todayStr) return;
                const { error } = await supabaseClient
                    .from('page_views')
                    .insert([{ view_date: todayStr, page_name: 'calendar' }]);
                if (!error) {
                    localStorage.setItem(ACCESS_LOG_STORAGE_KEY, todayStr);
                }
            } catch (e) {
                console.warn('PV記録スキップ:', e);
            }
        }

    </script>
</body>
